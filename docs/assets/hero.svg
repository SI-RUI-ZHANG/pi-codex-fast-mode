<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="pi-codex-fast-mode terminal demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b26"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- title block -->
  <text x="80" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="46" font-weight="700" fill="#e6edf3">pi-codex-fast-mode</text>
  <text x="80" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#8b949e">request OpenAI Fast mode — and nothing else</text>

  <!-- terminal window -->
  <rect x="80" y="196" width="1040" height="368" rx="14" fill="#010409" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="112" cy="228" r="7" fill="#ff5f56"/>
  <circle cx="136" cy="228" r="7" fill="#ffbd2e"/>
  <circle cx="160" cy="228" r="7" fill="#27c93f"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19">
    <text x="112" y="284" fill="#7aa2f7">❯ /fast</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">
    <text x="112" y="318" fill="#c9d1d9">Fast mode enabled for openai/gpt-6.1-sol. No speed or cost estimate.</text>
    <text x="112" y="344" fill="#8b949e">Requests ask for service_tier=priority; the backend may downgrade or reject.</text>

    <text x="112" y="396" fill="#484f58">Fast increases API charges or ChatGPT subscription usage.</text>
    <text x="112" y="432" fill="#3fb950">+   &quot;service_tier&quot;: &quot;priority&quot;</text>

    <text x="112" y="460" fill="#8b949e">Saved for new chats/workers; existing runtimes keep their own state.</text>
    <text x="112" y="486" fill="#e3b341">⚡ fast</text>
    <text x="112" y="524" fill="#484f58">off by default · effort and verbosity untouched · requested, never guaranteed</text>
  </g>
</svg>
